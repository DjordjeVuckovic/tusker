services:
  pg-news-native:
    image: pgvector/pgvector:pg18
    container_name: pg-native-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    # Building the HNSW index over 105k 1024-dim vectors needs the graph to fit
    # in maintenance_work_mem: it takes 73s at 1GB and 337s at the 64MB default,
    # where pgvector spills to disk after ~14k tuples and says so in a NOTICE.
    # Parallel maintenance workers allocate through shared memory, which Docker
    # caps at 64MB by default — far below the ~1GB such a build asks for.
    command: postgres -c maintenance_work_mem=1GB
    shm_size: 2gb
    ports:
      - "54320:5432"
    volumes:
      - pg_news_data:/var/lib/postgresql

  pg-news-parade:
    image: paradedb/paradedb:latest-pg18
    container_name: pg-parade-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    command: postgres -c maintenance_work_mem=1GB
    shm_size: 2gb
    ports:
      - "54321:5432"
    volumes:
      - pg_news_parade_data:/var/lib/postgresql

  pg-news-tiger:
    image: timescale/timescaledb-ha:pg18
    container_name: pg-tiger-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    # No command override: this image starts under Patroni rather than the
    # postgres entrypoint, so maintenance_work_mem has to be set per session or
    # via ALTER SYSTEM instead.
    shm_size: 2gb
    ports:
      - "54322:5432"
    volumes:
      - pg_news_tiger_data:/home/postgres/pgdata/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: es-news
    environment:
      - node.name=es-news
      - cluster.name=news-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_news_data:/usr/share/elasticsearch/data
      - ./configs/elasticsearch:/usr/share/elasticsearch/config/policies
    ports:
      - "9200:9200"
      - "9300:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana-news
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana-news
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch


volumes:
  pg_news_data:
    name: ${NEWS_VOLUME_NS:-news-hunter}_pg_news_data
    driver: local
  es_news_data:
    name: ${NEWS_VOLUME_NS:-news-hunter}_es_news_data
    driver: local
  pg_news_parade_data:
    name: ${NEWS_VOLUME_NS:-news-hunter}_pg_news_parade_data
    driver: local
  pg_news_tiger_data:
    name: ${NEWS_VOLUME_NS:-news-hunter}_pg_news_tiger_data
    driver: local
