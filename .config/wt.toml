[step.copy-ignored]
exclude = [
  "datasets/",
  "bin/",
  "benchmark_results/",
  "*.test",
  "*.out",
  "coverage.*",
]


[[post-start]]
deps = "go mod download"
copy-env = "for d in cmd/datapipe cmd/news_api; do cp {{ primary_worktree_path }}/$d/*.env {{ primary_worktree_path }}/$d/.env {{ worktree_path }}/$d/ 2>/dev/null || true; done"
copy-claude = "cp -R {{ primary_worktree_path }}/.claude/. {{ worktree_path }}/.claude/ 2>/dev/null || true"
copy-claude-local = "cp -R {{ primary_worktree_path }}/CLAUDE.local.md {{ worktree_path }}/CLAUDE.local.md 2>/dev/null || true"

[[pre-merge]]
vet = "go vet ./..."

[[pre-merge]]
test = "go test ./..."
