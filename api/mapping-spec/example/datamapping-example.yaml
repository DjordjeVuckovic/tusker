# DataMapping example: maps the columns of a raw news dataset onto articles.

kind: DataMapper
version: v1
metadata:
  name: "Example News Dataset"
  description: "Field mapping for a raw news dataset"
dataset: "example"
dateFormat: "2006-01-02T15:04:05Z"
idStrategy:
  kind: uuidv5
  source: "url"
constants:
  Language: eng
output:
  format: parquet
fieldMappings:
  - source: "url"
    sourceType: "url"
    target: "URL"
    required: true
  - source: "title"
    target: "Title"
    required: true
  - source: "summary"
    target: "Description"
  - source: "content"
    target: "Content"
  - source: "published_date"
    sourceType: "datetime"
    target: "PublishedAt"
  - source: "publication"
    target: "Metadata.PublisherName"
  - source: "authors"
    target: "Metadata.Authors"
    separator: ";"
  - source: "section"
    target: "Metadata.Section"
  - source: "word_count"
    sourceType: "int"
    target: "Metadata.Extra.wordCount"
