basePath: /
definitions:
  github_com_DjordjeVuckovic_tusker_internal_api_dto.Article:
    properties:
      content:
        type: string
      description:
        type: string
      id:
        type: string
      language:
        type: string
      metadata:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.Metadata'
      publishedAt:
        type: string
      publisherDomain:
        type: string
      title:
        type: string
      url:
        format: string
        type: string
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.ArticleSearchResult:
    properties:
      article:
        allOf:
        - $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.Article'
        description: Embedded Article struct for search results
      score:
        description: Score rank between 0 and 1
        type: number
      score_normalized:
        description: ScoreNormalized is the normalized(between 0-1) score
        type: number
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.BooleanParams:
    properties:
      expression:
        minLength: 1
        type: string
      language:
        type: string
    required:
    - expression
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.CapabilitiesResponse:
    properties:
      full_text:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Capabilities'
      query_types:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.QueryTypes'
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.HybridParams:
    properties:
      k:
        minimum: 1
        type: integer
      language:
        type: string
      query:
        minLength: 1
        type: string
    required:
    - query
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.MatchParams:
    properties:
      field:
        type: string
      fuzziness:
        type: string
      language:
        type: string
      operator:
        type: string
      query:
        minLength: 1
        type: string
    required:
    - field
    - query
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.Metadata:
    properties:
      authors:
        items:
          type: string
        type: array
      dateModified:
        type: string
      extra:
        additionalProperties: {}
        description: Extra carries dataset-specific fields that have no schema field.
        type: object
      image:
        type: string
      keywords:
        items:
          type: string
        type: array
      publisherName:
        type: string
      section:
        type: string
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.MultiMatchParams:
    properties:
      fields:
        description: Fields name the fields to match, each optionally boosted as "title^3".
        items:
          type: string
        minItems: 1
        type: array
      language:
        type: string
      operator:
        type: string
      query:
        minLength: 1
        type: string
    required:
    - fields
    - query
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.PhraseParams:
    properties:
      fields:
        items:
          type: string
        minItems: 1
        type: array
      language:
        type: string
      query:
        minLength: 1
        type: string
      slop:
        maximum: 3
        minimum: 0
        type: integer
    required:
    - fields
    - query
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.QueryTypes:
    properties:
      boolean:
        type: boolean
      hybrid:
        type: boolean
      match:
        type: boolean
      multi_match:
        type: boolean
      phrase:
        type: boolean
      query_string:
        type: boolean
      semantic:
        type: boolean
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.QueryWrapper:
    properties:
      boolean:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.BooleanParams'
      hybrid:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.HybridParams'
      match:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.MatchParams'
      multi_match:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.MultiMatchParams'
      phrase:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.PhraseParams'
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.SearchRequest:
    properties:
      cursor:
        type: string
      query:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.QueryWrapper'
      size:
        minimum: 1
        type: integer
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.SearchResponse:
    properties:
      effective:
        allOf:
        - $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Effective'
        description: |-
          Effective is the contract the search ran under, with every omitted
          parameter filled by the engine.
      has_more:
        type: boolean
      hits:
        items:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.ArticleSearchResult'
        type: array
      ignored:
        description: Ignored lists the stated parameters the engine did not honour.
        items:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Ignored'
        type: array
      max_score:
        type: number
      next_cursor:
        type: string
      page_max_score:
        type: number
      total_matches:
        type: integer
    type: object
  github_com_DjordjeVuckovic_tusker_internal_api_dto.SemanticSearchResponse:
    properties:
      has_more:
        type: boolean
      hits:
        items:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.Article'
        type: array
      next_cursor:
        type: string
    type: object
  github_com_DjordjeVuckovic_tusker_internal_types_operator.Operator:
    enum:
    - AND
    - OR
    type: string
    x-enum-varnames:
    - And
    - Or
  github_com_DjordjeVuckovic_tusker_internal_types_query.Capabilities:
    properties:
      boosts:
        type: boolean
      default_operator:
        allOf:
        - $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_operator.Operator'
        description: DefaultOperator combines terms when a request names no operator.
      engine:
        type: string
      fields:
        description: Fields are the fields the engine can match apart from every other
          field.
        items:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Field'
        type: array
      fuzziness:
        type: boolean
      phrase_slop:
        type: boolean
    type: object
  github_com_DjordjeVuckovic_tusker_internal_types_query.Effective:
    properties:
      fields:
        items:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Field'
        type: array
      language:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_query.Language'
      operator:
        $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_types_operator.Operator'
    type: object
  github_com_DjordjeVuckovic_tusker_internal_types_query.Field:
    enum:
    - title
    - description
    - content
    type: string
    x-enum-varnames:
    - FieldTitle
    - FieldDescription
    - FieldContent
  github_com_DjordjeVuckovic_tusker_internal_types_query.Ignored:
    properties:
      engine:
        type: string
      param:
        type: string
      reason:
        type: string
    type: object
  github_com_DjordjeVuckovic_tusker_internal_types_query.Language:
    enum:
    - english
    type: string
    x-enum-varnames:
    - LanguageEnglish
info:
  contact:
    email: support@tusker.sh
    name: API Support
  description: A full-text and semantic search engine for exploring multilingual news
    headlines and articles
  license:
    name: Apache 2.0
    url: https://opensource.org/licenses/Apache-2.0
  termsOfService: http://swagger.io/terms/
  title: Tusker API
  version: "1.0"
paths:
  /v1/articles/_search:
    post:
      consumes:
      - application/json
      description: 'Structured match, multi_match, phrase, boolean or hybrid search.
        A stated operator, field, fuzziness or language is honoured by the engine
        or the request is a 400 naming the parameter and the engine. An omitted operator
        takes the engine''s default (PostgreSQL AND, Elasticsearch OR). Boosts are
        best effort. A key the query type does not define is a 400. With `Prefer:
        handling=lenient` an unsupported parameter is removed before the search runs
        and listed in `ignored`. Every response echoes `effective` and `ignored`.'
      parameters:
      - description: Structured search request with query wrapper
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.SearchRequest'
      - description: handling=lenient drops a parameter the engine cannot honour and
          lists it in ignored, instead of a 400
        in: header
        name: Prefer
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: SearchStringQuery results with pagination metadata
          schema:
            $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.SearchResponse'
        "400":
          description: Bad request - invalid query structure or parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Query type not supported by searcher backend
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Structured search API
      tags:
      - search
  /v1/articles/search:
    get:
      consumes:
      - application/json
      description: 'Free-text search over title, description and content: operators
        and quotes are read as words. Terms combine under the engine''s default operator
        (PostgreSQL AND, Elasticsearch OR); the response echoes it in `effective`.
        Any query parameter not listed here is a 400. Cacheable and bookmarkable.'
      parameters:
      - description: SearchStringQuery query text
        example: '"climate change"'
        in: query
        name: q
        required: true
        type: string
      - description: 'Results per page (default: 100, max: 10000)'
        example: 10
        in: query
        name: size
        type: integer
      - description: Pagination cursor (base64-encoded from previous response)
        in: query
        name: cursor
        type: string
      - description: 'SearchStringQuery language: english, the only one supported
          (default: english)'
        example: '"english"'
        in: query
        name: lang
        type: string
      - description: handling=lenient drops a parameter the engine cannot honour and
          lists it in ignored, instead of a 400
        in: header
        name: Prefer
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: SearchStringQuery results with pagination metadata
          schema:
            $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.SearchResponse'
        "400":
          description: Bad request - missing or invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Simple query string search
      tags:
      - search
  /v1/articles/semantic_search:
    get:
      consumes:
      - application/json
      description: Perform vector-based semantic search using the embedding model.
        Supports pagination via cursor. Application determines optimal search strategy
        based on index configuration. Results are cacheable and bookmarkable.
      parameters:
      - description: SearchStringQuery query text
        example: '"climate change"'
        in: query
        name: q
        required: true
        type: string
      - description: 'Results per page (default: 100, max: 10000)'
        example: 10
        in: query
        name: size
        type: integer
      - description: Pagination cursor (base64-encoded from previous response)
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: SearchStringQuery results with pagination metadata
          schema:
            $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.SemanticSearchResponse'
        "400":
          description: Bad request - missing or invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Vector-based semantic search
      tags:
      - search
  /v1/capabilities:
    get:
      description: 'Returns the query types the running backend serves and the full-text
        parameters its engine honours: the operator it applies when a request names
        none, whether it supports fuzziness, phrase slop and boosts, and the fields
        it can match apart from every other field. A stated parameter outside these
        is a 400 unless the request sends `Prefer: handling=lenient`.'
      produces:
      - application/json
      responses:
        "200":
          description: Supported query types and parameters
          schema:
            $ref: '#/definitions/github_com_DjordjeVuckovic_tusker_internal_api_dto.CapabilitiesResponse'
      summary: Report supported query types and parameters
      tags:
      - capabilities
swagger: "2.0"
