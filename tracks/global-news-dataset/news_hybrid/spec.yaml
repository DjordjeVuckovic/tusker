schema_version: 1
id: news_hybrid
kind: hybrid
description: "Hybrid search: RRF fusion of BM25 + vector vs Elasticsearch hybrid"

defaults:
  pool_depth: 50
  # Hybrid pools mix keyword and semantic hits; token-overlap mis-grades the
  # semantic half, so grade with Claude Code rather than lexical.
  judgments: claude-cli

# Same ANN operating point as the semantic track; see its spec for why 200.
#
# embedding_model states which model's vectors each arm was measured against.
# The two PG arms are separate instances, each loaded on its own, so each one
# declares the model that went into it; the templates filter article_embeddings
# by it, and an arm that disagrees with the query embedder fails the run.
engines:
  pg-rrf:
    type: postgres
    connection: "postgresql://news_user:news_password@localhost:54320/news_db"
    connection_settings:
      plan_cache_mode: force_custom_plan
      hnsw.ef_search: "200"
    params:
      embedding_model: "qwen3-embedding:0.6b"
  paradedb-hybrid:
    type: postgres
    connection: "postgresql://news_user:news_password@localhost:54321/news_db"
    connection_settings:
      plan_cache_mode: force_custom_plan
      hnsw.ef_search: "200"
    params:
      embedding_model: "qwen3-embedding:0.6b"
  elasticsearch:
    type: elasticsearch
    connection: "http://localhost:9200"
    index: articles
    params:
      embedding_model: "qwen3-embedding:0.6b"

metrics:
  k_values: [3, 5, 10]
  # 2, not 1: ~90 % of this pool grades at least 1, which pinned P@3, P@5 and
  # MRR at 1.000 for every engine. Report the threshold beside the numbers.
  relevance_threshold: 2

runs:
  warmup: 1
  iterations: 3

jobs:
  - name: "hybrid-pg-vs-paradedb-vs-es"
    suite: suite.yaml
    engines: [pg-rrf, paradedb-hybrid, elasticsearch]
