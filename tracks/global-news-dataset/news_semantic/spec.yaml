schema_version: 1
id: news_semantic
kind: semantic
description: "Semantic / vector search: pgvector HNSW vs Elasticsearch dense_vector kNN"

defaults:
  pool_depth: 50
  # Semantic relevance can't be judged by token-overlap (relevant docs share no
  # keywords with the query), so grade with Claude Code rather than lexical.
  judgments: claude-cli

# pgvector defaults hnsw.ef_search to 40, below the LIMIT of 50 this suite asks
# for. 200 matches the num_candidates Elasticsearch is given.
#
# embedding_model states which model's vectors each arm was measured against.
# The PG templates filter article_embeddings by it; every arm is checked against
# the model that embeds the query, and a disagreement fails the run.
engines:
  pgvector-cosine:
    type: postgres
    connection: "postgresql://news_user:news_password@localhost:54320/news_db"
    connection_settings:
      plan_cache_mode: force_custom_plan
      hnsw.ef_search: "200"
    params:
      embedding_model: "qwen3-embedding:0.6b"
  # Ground truth for the ANN arm: same query, same operator, no index, so it
  # returns the true nearest neighbours. Recall of pgvector-cosine against this
  # is what the HNSW speedup costs.
  pgvector-exact:
    type: postgres
    connection: "postgresql://news_user:news_password@localhost:54320/news_db"
    connection_settings:
      plan_cache_mode: force_custom_plan
      enable_indexscan: "off"
    params:
      embedding_model: "qwen3-embedding:0.6b"
  elasticsearch:
    type: elasticsearch
    connection: "http://localhost:9200"
    index: articles
    params:
      embedding_model: "qwen3-embedding:0.6b"

metrics:
  k_values: [3, 5, 10]
  # 2, not 1: ~90 % of this pool grades at least 1, which pinned P@3, P@5 and
  # MRR at 1.000 for every engine. Report the threshold beside the numbers.
  relevance_threshold: 2

runs:
  warmup: 1
  iterations: 3

jobs:
  - name: "pgvector-vs-es-knn"
    suite: suite.yaml
    engines: [pgvector-cosine, pgvector-exact, elasticsearch]
