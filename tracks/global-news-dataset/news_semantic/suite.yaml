schema_version: 1
id: news_semantic_v1
name: "News Semantic Search Benchmark v1"
description: "Concept-level queries that require semantic understanding beyond keyword overlap"
version: "1.0.0"

corpus:
  name: news_hunter_articles
  source: "postgres://localhost:54320/news_db (articles)"

# Query embeddings (the query_vector arg) use Qwen3-Embedding-0.6B (1024-dim),
# L2-normalised (scripts/embed_qwen3.ipynb). Document vectors live in
# article_embeddings (VECTOR(1024)); requires migrations (make migrate-up-all).
#
# Cosine is the only distance measured here. On unit vectors <->, <#> and <=>
# rank identically, since ||a-b||^2 = 2 - 2*cos(a,b), so a second operator would
# add an index and a column to the table without adding a result.
#
# Every ES block sets "size" to knn.k. Without it ES returns its default of 10
# hits regardless of k, capping AP and Bpref at 10/R.
#
# article_embeddings is keyed (article_id, model_name), so two models coexist in
# it by design and an unfiltered scan would rank across both vector spaces.
# The embedding_model arg comes from the engine's params in spec.yaml. The ES arm
# needs no equivalent: the vector is a field on the article document, so a second
# model overwrites rather than joins.

templates:
  - id: pgvector_cosine
    args: [embedding_model, query_vector, limit]
    query: |
      SELECT article_id AS id FROM article_embeddings
      WHERE model_name = $1
      ORDER BY embedding <=> $2::vector
      LIMIT $3::int

  - id: es_knn
    args: [query_vector]
    query: |
      {
        "knn": {
          "field": "embedding",
          "query_vector": {{#toJson}}query_vector{{/toJson}},
          "k": 50,
          "num_candidates": 200
        },
        "size": 50
      }

queries:
  # Semantic queries test conceptual understanding: the relevant documents may
  # not share exact keywords with the query text.

  - id: sem-economic-crisis-consequences
    description: "Articles about economic downturns, recessions, job losses — broader than 'recession'"
    engines:
      pgvector-cosine:
        template: pgvector_cosine
        params: { limit: 50 }
      pgvector-exact:
        template: pgvector_cosine
        params: { limit: 50 }
      elasticsearch:
        template: es_knn

  - id: sem-political-leadership-change
    description: "Leadership transitions, elections, coups — not just 'election' keyword"
    engines:
      pgvector-cosine:
        template: pgvector_cosine
        params: { limit: 50 }
      pgvector-exact:
        template: pgvector_cosine
        params: { limit: 50 }
      elasticsearch:
        template: es_knn

  - id: sem-environmental-impact
