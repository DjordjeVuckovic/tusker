  # --- Additional boolean queries ---

  - id: bool-tech-not-crypto
    description: "Boolean: technology articles excluding cryptocurrency"
    category: boolean
    engines:
      # OR-only engine: exclusion terms (cryptocurrency, bitcoin) are dropped.
      tiger:
        template: tiger_bm25
        params: { terms: "technology", limit: 100 }
      pg-seq:
        template: pg_fts_boolean
        params: { fields: "title || ' ' || coalesce(description,'') || ' ' || coalesce(content,'')", tsquery_expr: "technology & !cryptocurrency & !bitcoin", limit: 100 }
      pg-gin:
        template: pg_idx_boolean
        params: { tsquery_expr: "technology & !cryptocurrency & !bitcoin", limit: 100 }
      pg-noindex:
        template: pg_idx_boolean
        params: { tsquery_expr: "technology & !cryptocurrency & !bitcoin", limit: 100 }
      paradedb: |
        SELECT id FROM articles
        WHERE id @@@ paradedb.boolean(
          must => ARRAY[
            paradedb.boolean(should => ARRAY[
              paradedb.match('title', 'technology'),
              paradedb.match('description', 'technology')
            ])
          ],
          must_not => ARRAY[
            paradedb.boolean(should => ARRAY[
              paradedb.match('title', 'cryptocurrency'),
              paradedb.match('title', 'bitcoin')
            ])
          ]
        )
        ORDER BY pdb.score(id) DESC
        LIMIT 100
      elasticsearch: |
        {
          "query": {
            "bool": {
              "must": [
                { "multi_match": { "query": "technology", "fields": ["title", "description"] } }
              ],
              "must_not": [
                { "multi_match": { "query": "cryptocurrency bitcoin", "fields": ["title", "description"] } }
              ]
            }
          },
          "size": 100
        }

