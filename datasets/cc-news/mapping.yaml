kind: DataMapper
version: v1
metadata:
  name: "CC-News (vblagoje/cc_news)"
  description: "Mapping for the CC-News dataset, 708,241 English articles from 8,759 domains, 2017-01..2019-08, full body text via news-please. The source column image_url has no Article target and is dropped at fetch time."
dataset: cc_news
dateFormat: "2006-01-02 15:04:05"
fieldMappings:
  - source: "title"
    sourceType: "string"
    target: "Title"
    targetType: "string"
    required: true
  - source: "text"
    sourceType: "string"
    target: "Content"
    targetType: "string"
    required: false
  - source: "description"
    sourceType: "string"
    target: "Description"
    targetType: "string"
    required: false
  - source: "url"
    sourceType: "url"
    target: "URL"
    targetType: "url"
    required: false
  - source: "date"
    sourceType: "datetime"
    target: "PublishedAt"
    targetType: "datetime"
    required: false
  - source: "domain"
    sourceType: "string"
    target: "Metadata.SourceName"
    targetType: "string"
    required: false
